[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The DISTRIBUTION name. The import name is `meep_gpu` and is fixed: it is part of
# the certification ledgers' path keys and of every `MEEP_GPU_*` environment
# variable. To change the distribution and repository name everywhere, run
#     python tools/rename_distribution.py --name NEW-NAME --apply
# and never edit the name by hand.
name = "meep-gpu"
version = "1.0.1"
description = "GPU time stepping for MEEP simulations: steps a simulation built by the user's own MEEP installation on one NVIDIA or Apple GPU"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# Name-only entries keep the citation order in the built metadata: an entry with an
# e-mail is written to a different metadata field, ahead of or apart from the rest.
authors = [
  { name = "Ivan Biggs" },
  { name = "Alicia Zeng" },
  { name = "Yanlin Dou" }
]
maintainers = [
  { name = "Ivan Biggs", email = "biggsic@ucla.edu" }
]
keywords = ["FDTD", "MEEP", "GPU", "CUDA", "Metal", "electromagnetics", "photonics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Environment :: GPU :: NVIDIA CUDA"
]
# MEEP is a prerequisite and is not listed here. MEEP's Python module is
# distributed through conda-forge (package `pymeep`) or built from source; it is
# not installable from the Python package index, where the name `meep` belongs to
# an unrelated project. Install MEEP first, into the environment that will run
# this package; INSTALL.md says how. Importing `meep_gpu` does not
# import MEEP: only the three entry points that accept an `mp.Simulation` do.
# NumPy is the only run-time dependency. SciPy is not one: the single route that
# needs it is MEEP's own 2-D Gaussian-beam source synthesis, and the lift names
# SciPy in its refusal when it is missing. NumPy 2.0 is the floor: the array
# path's identity with MEEP (Tier A, docs/development/testing.md) is judged on
# NumPy 2 releases only.
dependencies = [
  "numpy>=2.0"
]

[project.urls]
Homepage = "https://github.com/Erised-AI-Inc/meep-gpu"
Repository = "https://github.com/Erised-AI-Inc/meep-gpu"
Issues = "https://github.com/Erised-AI-Inc/meep-gpu/issues"
Changelog = "https://github.com/Erised-AI-Inc/meep-gpu/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Two recipes install the device libraries. INSTALL.md, "Certified and
# supported versions", holds the one table of both.
#
#   * SUPPORTED, the default extras (`nvidia`, `nvidia-cuda11`, `fdtd-gpu`,
#     `fdtd-gpu-triton`, `apple`): each library has a lower bound, the version
#     the kernels were certified with, and no upper bound unless a known
#     incompatibility is stated beside it, so newer releases install. The
#     compiled kernels run on them, and the run is recorded as not certified
#     (`certified: False`, and one `meep_gpu: NOTE` line names what is not).
#   * CERTIFIED (`nvidia-certified`, `apple-certified`): exact pins, the
#     versions the certification record was cut on. Bit identity with the
#     reference MEEP holds on this recipe only, on certified hardware, beside
#     the rest of the certified stack, which no installer can pin (INSTALL.md
#     lists it). To verify a host, run with MEEP_GPU_HARDWARE=certified: every
#     fact outside the certified identity is then refused by name and the run
#     takes the array path.
#
# The packaging test (meep_gpu/test_triton_kernels.py) holds both recipes to
# these rules, and the certified pins to the records they come from.
# ---------------------------------------------------------------------------
# The NVIDIA route: CuPy (array path and hand-written CUDA kernels), Triton
# (compiled kernels) and PyTorch, which Triton imports to select its NVIDIA
# driver; the package itself does not use PyTorch on this route.
#
#   * A CuPy wheel's NAME encodes the CUDA major version and no environment
#     marker can express the toolkit a host has installed. `nvidia` installs the
#     CUDA 12 build and `nvidia-cuda11` the CUDA 11 build. The two cannot be
#     installed together.
#   * CuPy 13.5.1 or later, with no upper bound. This package suspends MEEP's
#     flush-to-zero mode for the length of every CuPy compile (without that, a
#     kernel that includes CCCL's <cuda/std/limits> fails to build once MEEP is
#     imported) and applies the `keep` subnormal policy, both at the compiler
#     front end CuPy's compile path calls. CuPy renamed that function in 14
#     (`compile_using_nvrtc` in 13, `_compile_using_nvrtc_no_warning` in 14), so
#     the package reads it off the compile path and refuses by name a CuPy whose
#     compile path calls none it recognizes. Run with the package: CuPy 14.2.0,
#     the CUDA 12 build (NVRTC 12.4, NumPy 2.2.6, Python 3.10), as well as
#     13.5.1. CuPy 14 needs NumPy 2.0 or later, below 2.6, and has no CUDA 11
#     build: `nvidia-cuda11` stays on CuPy 13.
#   * Triton 3.1 or later, with no upper bound. When a run is planned, the
#     package compiles and launches one small kernel through the installed
#     Triton; a Triton that cannot is set aside by name and the hand-written
#     CUDA kernels run without it. A Triton older than 3.1 is refused by name
#     unless MEEP_GPU_HARDWARE=any.
#   * PyTorch 2.5.1 or later. Every PyTorch release requires one Triton
#     release on Linux (2.5.1 requires exactly 3.1.0; a newer PyTorch, a newer
#     Triton), so PyTorch chooses the Triton and no Triton pin here may
#     contradict it.
#   * The extras install Python packages only. The NVIDIA driver, the CUDA
#     libraries a CuPy wheel loads and the C compiler Triton uses at its first
#     launch belong to the host.
#   * Every entry is marked linux-x86_64, so installing an NVIDIA extra on
#     another platform installs nothing instead of failing to resolve.
# ---------------------------------------------------------------------------
nvidia = [
  "meep-gpu[fdtd-gpu-triton]",
  "torch>=2.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
nvidia-cuda11 = [
  "cupy-cuda11x>=13.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch>=2.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# `fdtd-gpu` (CuPy alone: the array path and the hand-written CUDA kernels) and
# `fdtd-gpu-triton` (CuPy and Triton) are the parts `nvidia` is built from;
# `nvidia` adds PyTorch.
fdtd-gpu = [
  "cupy-cuda12x>=13.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
fdtd-gpu-triton = [
  "meep-gpu[fdtd-gpu]",
  "triton>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# The certified NVIDIA recipe, the CUDA 11 build: no CUDA 12 build is certified.
# The stack of record is CuPy 13.5.1 (CUDA 11 build), Triton 3.1.0 and PyTorch
# 2.5.1, on compute capabilities 8.6 and 8.9. The certification record also
# names NVRTC and the CUDA runtime 11.8, which a CUDA 12 build of CuPy cannot
# load, so on a CUDA 12 toolkit there is no certified recipe: the same versions
# through `nvidia` run the fast path and are recorded as not certified. The
# Triton pin repeats the one PyTorch 2.5.1 requires. Triton 3.1.0 publishes
# wheels for Python 3.8 to 3.12, so this recipe needs Python 3.10, 3.11 or 3.12.
# Verify with MEEP_GPU_HARDWARE=certified.
nvidia-certified = [
  "cupy-cuda11x==13.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# ---------------------------------------------------------------------------
# The Apple route: PyTorch supplies the MPS device and the Metal shader
# frontend the Metal kernels launch through. Certified environments of record:
# applegpu_g13s (Apple M1 Max, Metal frontend metalfe-32023.921.5) and
# applegpu_g16g (Apple M4, metalfe-32023.886.1), each with torch 2.10.0 and
# PYTORCH_MPS_FAST_MATH unset or 0. The GPU and the frontend (one per macOS
# build) belong to the host and cannot be pinned by an installer.
#
#   * `apple`, supported: PyTorch 2.10.0 or later, with no upper bound. On any
#     environment other than a certified one the Metal kernels run and the
#     run is recorded as not certified.
#   * `apple-certified`: PyTorch 2.10.0 exactly. MEEP_GPU_HARDWARE=certified
#     verifies the rest of a certified environment, and refuses anything
#     else by name to the array path.
# ---------------------------------------------------------------------------
apple = [
  "torch>=2.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'"
]
apple-certified = [
  "torch==2.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'"
]
test = [
  "pytest>=8.2.0"
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
# The certification harness under parity/ is NOT installed. Using the package
# needs nothing from it.
include = ["meep_gpu*"]
exclude = ["parity*", "examples*", "tools*", "docs*", "benchmarks*"]
namespaces = false

[tool.setuptools.package-data]
# Run-time data. The kernel tables open their certification ledgers beside the
# modules when a run is planned; a wheel built without them would leave every
# table unreadable. Listed by directory, not by a recursive glob, so nothing
# else under the package directory rides along.
meep_gpu = ["LICENSE", "NOTICE"]
"meep_gpu.cuda_kernels" = ["*.json", "*.txt"]
"meep_gpu.triton_kernels" = ["*.json", "*.txt"]
"meep_gpu.metal_kernels" = ["*.json"]

[tool.pytest.ini_options]
# Two suites: the package's own tests, beside the code, and the certification
# harness's tests. Both pin kernel dispatch OFF in their conftest so the suite
# exercises the array-path reference; certification of the kernels is the gate
# harness under parity/meep_gpu, not this suite.
testpaths = ["meep_gpu", "parity/meep_gpu"]
# Never collect an artifact tree. Gate and benchmark runs write their output
# under parity/meep_gpu/results/, including staged copies of source. Anything
# named test_*.py that lands there would otherwise be collected by the default
# invocation and run against the live package with another tree's expectations.
norecursedirs = [
  "parity/meep_gpu/results",
  "*/results",
  "results",
  "site",
  "_scratch",
  "examples",
  "benchmarks",
  "docs",
  "tools",
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}"
]
# Report every collection error instead of stopping at the first one.
addopts = "--continue-on-collection-errors"
# A test function that returns a value instead of asserting validates nothing.
filterwarnings = [
  "error::pytest.PytestReturnNotNoneWarning"
]
